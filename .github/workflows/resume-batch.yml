name: resume-batch

# Batch resume build from the dashboard issue. Tick the "📄 build resume" box on
# the rows you want, then tick the top "Build selected resumes" box. This builds
# a tailored .docx for every ticked-and-not-yet-built row (commit mode ->
# resumes/<user>/), commits them with the updated state, and repaints the issue
# so each built row shows its resume link and the trigger resets itself.
#
# The guard fires only when the trigger box is ticked, so ordinary applied-box
# ticks don't run this. The repaint always renders the trigger unchecked, so the
# bot's own edit can't re-trigger the workflow (no loop).
#
# Reusable from a separate data repo (the issue lives there; `github.event`
# is always the caller's event). The caller keeps the `issues: [edited]`
# trigger and the `if:` guard, see watch.yml for the checkout layout.

on:
  issues:
    types: [edited]
  workflow_call:
    inputs:
      code_ref:
        type: string
        default: ""
      data_ref:
        type: string
        default: ""
      environment:
        type: string
        default: ""

permissions:
  issues: write
  contents: write   # commit resumes/ + state/seen.json

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: resume-batch-${{ github.event.issue.number }}
      cancel-in-progress: false
    if: >-
      contains(github.event.issue.title, 'intern-watch matches') &&
      contains(github.event.issue.body, '[x] **Build selected resumes**')
    env:
      INTERN_WATCH_DATA_DIR: ${{ github.workspace }}
      DATA_BRANCH: ${{ inputs.data_ref || github.ref_name }}
    steps:
      - name: React 👀
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/reactions" \
            -f content=eyes >/dev/null || true

      - name: Check out data (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_ref || github.ref }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ inputs.code_ref || job.workflow_sha || github.sha }}
          path: code
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: User from issue title
        id: who
        env:
          TITLE: ${{ github.event.issue.title }}
        run: |
          # "📋 intern-watch matches — <user>" (em dash separator).
          user=$(printf '%s' "$TITLE" | sed 's/.*—[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$user" ]; then
            echo "cannot parse user from issue title: $TITLE" >&2
            exit 1
          fi
          echo "user=$user" >> "$GITHUB_OUTPUT"

      - name: Build selected resumes
        id: build
        working-directory: code
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # JD reacquisition (jobright)
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -m src.resume.batch \
            --user "${{ steps.who.outputs.user }}" \
            --summary /tmp/batch_comment.md

      - name: Commit built resumes + state
        if: steps.build.outputs.built != '0' && steps.build.outputs.built != ''
        run: |
          git config user.name "intern-watch[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          [ -d resumes ] && git add resumes/ || true
          if ! git diff --cached --quiet; then
            git commit -m "resume: batch build from dashboard"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "HEAD:$DATA_BRANCH"
          fi

      - name: Repaint dashboard issue
        if: always()
        working-directory: code
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m src.dashboard --user "${{ steps.who.outputs.user }}" || true

      - name: Comment summary
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -s /tmp/batch_comment.md ]; then
            gh issue comment "${{ github.event.issue.number }}" \
              --repo "${{ github.repository }}" \
              --body-file /tmp/batch_comment.md
          fi
