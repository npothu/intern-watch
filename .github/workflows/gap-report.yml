name: gap-report

# Weekly coverage-gap report: every hand-added posting is one the watcher
# missed. src/coverage.py maps each manual add to its ATS + board, diffs that
# against data/ats_boards.yaml, and this workflow keeps ONE open issue titled
# "coverage gaps" current with the paste-ready rows, the employers on ATSes
# with no adapter, and the hand-check watchlist (manual_watchlist.yaml in the
# data repo, see data/manual_watchlist.example.yaml).
#
# Read-only: it commits nothing and never touches state/ or the webui.
#
# Reusable from a separate data repo exactly like watch.yml:
#
#   on:
#     schedule: [{cron: "0 12 * * 1"}]
#     workflow_dispatch:
#   permissions:
#     contents: read
#     issues: write
#   jobs:
#     gaps:
#       uses: <owner>/intern-baddie/.github/workflows/gap-report.yml@main
#       secrets: inherit
#
# The issue opens in the caller (data) repo. With no manual adds and no
# watchlist (e.g. the bare template) no issue is opened at all.

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch:
    inputs:
      code_ref:
        description: "Code ref to run; blank = this workflow's commit"
        type: string
        default: ""
      data_ref:
        description: "Data branch to read; blank = current branch"
        type: string
        default: ""
      environment:
        description: "GitHub environment (e.g. staging); blank = repo-level"
        type: string
        default: ""
  workflow_call:
    inputs:
      code_ref:
        type: string
        default: ""
      data_ref:
        type: string
        default: ""
      environment:
        type: string
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: gap-report
      cancel-in-progress: false
    env:
      INTERN_BADDIE_DATA_DIR: ${{ github.workspace }}
    steps:
      - name: Check out data (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_ref || github.ref }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ inputs.code_ref || job.workflow_sha || github.sha }}
          path: code
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Build the report
        working-directory: code
        env:
          STORE: ${{ vars.STORE || 'github' }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_SECRET: ${{ secrets.CONVEX_SECRET }}
        run: python scripts/gap_report.py --skip-if-empty --out "$RUNNER_TEMP/gaps.md"

      - name: Open or update the "coverage gaps" issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -s "$RUNNER_TEMP/gaps.md" ]; then echo "nothing to report"; exit 0; fi
          title="coverage gaps"
          # Plain listing, not --search: the search index can lag a fresh issue.
          number=$(gh issue list --state open --limit 500 --json number,title \
                     --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/gaps.md"
            echo "updated #$number"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/gaps.md"
          fi
