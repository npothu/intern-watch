# One dashboard write (applied / saved / hidden toggle, or a tracker status
# on the applications ledger) committed straight into state.
#
# The dashboard issue only renders the newest rows (byte-budgeted), so older
# matches have no checkbox to write through -- and tracker statuses have no
# issue representation at all. The webui dispatches this workflow instead:
# src.statewrite edits the match/ledger record, src.dashboard repaints the
# issue (which also syncs the ledger), and the state commit follows the
# exact watch.yml pattern. Shares the `watch` concurrency group so state
# committers serialize instead of racing.
#
# Reusable from a separate data repo exactly like watch.yml (see there).

name: dashboard-write

on:
  workflow_dispatch:
    inputs:
      user:
        description: "watcher user (users/<name>.yaml)"
        required: true
        type: string
      short:
        description: "12-hex dashboard short key of the match"
        required: true
        type: string
      field:
        description: "which field"
        required: true
        type: choice
        options: [applied, saved, dismissed, status]
      value:
        description: "true/false, or a status name for field=status"
        required: true
        type: string
      note:
        description: "history note (field=status only)"
        required: false
        type: string
        default: ""
      code_ref:
        description: "Code ref to run; blank = this workflow's commit"
        type: string
        default: ""
      data_ref:
        description: "Data branch; blank = current branch"
        type: string
        default: ""
      environment:
        description: "GitHub environment (e.g. staging); blank = repo-level"
        type: string
        default: ""
  workflow_call:
    inputs:
      user:
        required: true
        type: string
      short:
        required: true
        type: string
      field:
        required: true
        type: string
      value:
        required: true
        type: string
      note:
        type: string
        default: ""
      code_ref:
        type: string
        default: ""
      data_ref:
        type: string
        default: ""
      environment:
        type: string
        default: ""

permissions:
  contents: write
  issues: write

jobs:
  write:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: watch
      cancel-in-progress: false
    env:
      INTERN_WATCH_DATA_DIR: ${{ github.workspace }}
      DATA_BRANCH: ${{ inputs.data_ref || github.ref_name }}
    steps:
      - name: Check out data (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_ref || github.ref }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ inputs.code_ref || job.workflow_sha || github.sha }}
          path: code
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Apply the write
        working-directory: code
        env:  # note is user-typed text; env quoting keeps it inert
          NOTE: ${{ inputs.note }}
          STORE: ${{ vars.STORE || 'github' }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_SECRET: ${{ secrets.CONVEX_SECRET }}
        run: |
          python -m src.statewrite \
            --user "${{ inputs.user }}" \
            --short "${{ inputs.short }}" \
            --field "${{ inputs.field }}" \
            --value "${{ inputs.value }}" \
            --note "$NOTE"

      - name: Repaint the dashboard issue
        working-directory: code
        run: python -m src.dashboard --user "${{ inputs.user }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE: ${{ vars.STORE || 'github' }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_SECRET: ${{ secrets.CONVEX_SECRET }}

      - name: Commit state
        run: |
          git config user.name "intern-watch[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          [ -f state/applications.json ] && git add state/applications.json || true
          if ! git diff --cached --quiet; then
            git commit -m "state: dashboard write (${{ inputs.field }})"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "HEAD:$DATA_BRANCH"
          fi
