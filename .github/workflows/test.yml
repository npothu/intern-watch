name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # requirements-dev pulls in requirements.txt plus ruff/mypy.
      - run: pip install -r requirements-dev.txt
      # Cheapest checks first, so an obvious defect fails in seconds rather
      # than after the ~2min suite. Config in pyproject.toml.
      - name: Lint
        run: python -m ruff check .
      - name: Typecheck
        run: python -m mypy
      # Preflight: schema + secret-wiring check on users/*.yaml. Runs before
      # pytest so a config/secret mistake fails fast with an actionable report.
      - run: python -m src.config_check
      - run: python -m pytest tests -q
