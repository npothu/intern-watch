name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Preflight: schema + secret-wiring check on users/*.yaml. Runs before
      # pytest so a config/secret mistake fails fast with an actionable report.
      - run: python -m src.config_check
      - run: python -m pytest tests -q
