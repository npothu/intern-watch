name: watch

# Runs directly in this repo (schedule/dispatch) OR as a reusable workflow
# from a separate private DATA repo that holds users/, state/ and resumes/:
#
#   jobs:
#     watch:
#       uses: <owner>/intern-watch/.github/workflows/watch.yml@main
#       secrets: inherit
#
# Either way the job checks out the DATA repo (the caller) at the workspace
# root and the CODE repo (the repo this workflow file lives in) under code/,
# runs the pipeline from code/ with INTERN_WATCH_DATA_DIR pointing at the
# workspace, and commits state back to the data repo. When both are the same
# repo (the template default) that is just two checkouts of the same thing.

on:
  schedule:
    - cron: "0 */2 * * *"   # every 2h; jobright rows can vanish within ~5h of
                            # appearing (observed 2026-06-12), so 6h had a gap.
                            # Even-hour ticks also cover the EDT send slots
                            # (8am/12pm/6pm ET = 12/16/22 UTC).
    - cron: "0 13,17,23 * * *"  # EST send-slot ticks (8am/12pm/6pm ET in winter
                                # = 13/17/23 UTC, odd hours the 2h cron misses).
                                # Off-season these ticks just find "not due".
  workflow_dispatch:
    inputs:
      send_now:
        description: "Flush the email outbox immediately, ignoring send slots"
        type: boolean
        default: false
      code_ref:
        description: "Code ref to run (branch/tag/sha); blank = this workflow's commit"
        type: string
        default: ""
      data_ref:
        description: "Data branch to read and commit state to; blank = current branch"
        type: string
        default: ""
      environment:
        description: "GitHub environment whose secrets/vars to use (e.g. staging); blank = repo-level"
        type: string
        default: ""
  workflow_call:
    inputs:
      send_now:
        type: boolean
        default: false
      code_ref:
        type: string
        default: ""
      data_ref:
        type: string
        default: ""
      environment:
        type: string
        default: ""

permissions:
  contents: write
  issues: write     # match-dashboard issue (users with `dashboard: true`)

jobs:
  watch:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: watch
      cancel-in-progress: false
    env:
      INTERN_WATCH_DATA_DIR: ${{ github.workspace }}
      DATA_BRANCH: ${{ inputs.data_ref || github.ref_name }}
    steps:
      - name: Check out data (this repo)
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_ref || github.ref }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository || github.repository }}
          ref: ${{ inputs.code_ref || job.workflow_sha || github.sha }}
          path: code
          # A private code repo needs a PAT with read access; public needs nothing.
          token: ${{ secrets.CODE_REPO_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: code/requirements.txt

      - run: pip install -r code/requirements.txt

      - name: Restore jobright session
        uses: actions/cache@v4
        with:
          path: state/jobright_session.json
          key: jobright-session-${{ github.run_id }}
          restore-keys: |
            jobright-session-

      - name: Run intern-watch
        working-directory: code
        run: python -m src.main ${{ inputs.send_now == true && '--send-now' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        # polite fetching, optional
          # LLM classifier keys -- expose whichever providers users configure
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # one block per user -- env var names must match the user yaml's
          # notify.email.smtp_*_env / notify.discord_webhook_env
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          JOBRIGHT_EMAIL: ${{ secrets.JOBRIGHT_EMAIL }}
          JOBRIGHT_PASSWORD: ${{ secrets.JOBRIGHT_PASSWORD }}
          # TrackerStore driver -- repo (or environment) Actions variable,
          # defaults to the zero-infra GitHub driver; set the STORE variable
          # to `convex` (plus the two secrets) after running the tracker migration
          STORE: ${{ vars.STORE || 'github' }}
          CONVEX_URL: ${{ secrets.CONVEX_URL }}
          CONVEX_SECRET: ${{ secrets.CONVEX_SECRET }}

      # Committing state also keeps the repo active, which prevents GitHub
      # from disabling the scheduled workflow after 60 days of inactivity.
      - name: Commit state
        run: |
          git config user.name "intern-watch[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          # the applications ledger appears with the first applied tick;
          # resumes/ once commit/email mode has built one. A missing
          # pathspec would abort the add, so guard both.
          [ -f state/applications.json ] && git add state/applications.json || true
          [ -d resumes ] && git add resumes/ || true
          if ! git diff --cached --quiet; then
            git commit -m "state: $(date -u +'%Y-%m-%d %H:%MZ')"
            git pull --rebase origin "$DATA_BRANCH"
            git push origin "HEAD:$DATA_BRANCH"
          fi
