name: convex-test

on:
  push:
    paths:
      - "convex/**"
      - "package.json"
      - "vitest.config.mts"
      - ".github/workflows/convex-test.yml"
  pull_request:
    paths:
      - "convex/**"
      - "package.json"
      - "vitest.config.mts"
      - ".github/workflows/convex-test.yml"

jobs:
  convex-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      # Code generation needs a deployment to inspect, but CI must not use a
      # cloud deployment. A single bounded anonymous local run starts the
      # backend, generates the bindings, pushes the functions, and shuts the
      # backend down before Vitest starts.
      - name: Generate convex/_generated via a local backend
        run: CONVEX_AGENT_MODE=anonymous npx convex dev --once --typecheck disable
      - run: npm test
