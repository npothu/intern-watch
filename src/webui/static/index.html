<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>intern-watch</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2333604a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
<style>
  :root {
    --bg: #f4f2ed;
    --surface: #fcfbf8;
    --ink: #211f1a;
    --ink-2: #6b6557;
    --line: #e2ded3;
    --line-2: #cdc8ba;
    --accent: #33604a;
    --accent-ink: #f2f8f4;
    --amber: #96691e;
    --red: #a8402f;
    --chip: #ebe8de;
    --mono: ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171612; --surface: #1e1c17; --ink: #e9e5d9; --ink-2: #9d977f;
      --line: #2d2a22; --line-2: #403c30; --accent: #83b79a;
      --accent-ink: #12211a; --amber: #d0a04f; --red: #d3705d;
      --chip: #2a2820;
    }
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 14px/1.45 Switzer, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 22px 20px 90px; }

  /* header */
  header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .brand .user { color: var(--ink-2); font-weight: 400; }
  .spacer { flex: 1; }
  .updated { color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .updated.stale { color: var(--amber); }
  .statline { margin: 6px 0 18px; color: var(--ink-2); font-size: 13px; font-variant-numeric: tabular-nums; }
  .statline b { color: var(--ink); font-weight: 600; }
  .statline .seg { cursor: pointer; }
  .statline .seg:hover, .statline .seg:hover b {
    color: var(--accent); text-decoration: underline dashed;
  }

  /* tracker funnel bar */
  .funnelbar {
    display: flex; height: 14px; margin: 10px 0 8px; overflow: hidden;
    border: 1px solid var(--line-2); border-radius: 7px;
  }
  .funnelbar[hidden] { display: none; }
  .funnelbar span { display: block; min-width: 8px; }
  .fb-applied { background: color-mix(in srgb, var(--accent) 75%, transparent); }
  .fb-oa, .fb-phone_screen { background: var(--amber); }
  .fb-interview, .fb-offer { background: var(--accent); }
  .fb-rejected { background: var(--red); }
  .fb-withdrawn { background: color-mix(in srgb, var(--ink-2) 50%, transparent); }

  .banner {
    border: 1px solid var(--line-2); border-left: 3px solid var(--amber);
    background: var(--surface); color: var(--ink-2);
    padding: 8px 12px; margin: 0 0 14px; font-size: 13px; border-radius: 4px;
  }

  /* controls */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
  input[type=search] {
    flex: 1; min-width: 220px; padding: 7px 10px; font: inherit;
    color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-2); border-radius: 5px; outline: none;
  }
  input[type=search]:focus { border-color: var(--accent); }
  select {
    font: inherit; color: var(--ink); background: var(--surface);
    border: 1px solid var(--line-2); border-radius: 5px; padding: 7px 8px;
  }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0 4px; }
  .chip {
    border: 1px solid var(--line-2); background: transparent; color: var(--ink-2);
    font: 500 12.5px/1 Switzer, sans-serif; padding: 6px 10px;
    border-radius: 999px; cursor: pointer;
  }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

  button { font: inherit; cursor: pointer; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    padding: 6px 10px; border-radius: 5px; font-size: 13px; font-weight: 500;
    text-decoration: none; white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-2); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); }
  .btn.quiet:hover { color: var(--ink); }
  .btn svg { width: 14px; height: 14px; }

  /* sections + rows */
  h2 {
    font-size: 12px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: var(--ink-2); margin: 26px 0 6px;
  }
  h2 .n { color: var(--ink-2); font-weight: 400; letter-spacing: 0; margin-left: 6px; }
  .rows { border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
  .row {
    display: grid; grid-template-columns: 40px minmax(0,1fr) auto;
    gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--line);
    align-items: start;
  }
  .row:first-child { border-top: 0; }
  .row.applied .head, .row.applied .meta { opacity: .5; }
  .row.new { box-shadow: inset 3px 0 0 var(--accent); }
  .newdot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent); margin-right: 6px; vertical-align: 1px;
  }
  .row.cur, .trow.cur { box-shadow: inset 0 0 0 1.5px var(--accent); }
  .row.new.cur { box-shadow: inset 3px 0 0 var(--accent), inset 0 0 0 1.5px var(--accent); }
  .head { min-width: 0; }
  .company { font-weight: 600; }
  .title { color: var(--ink); text-decoration: none; }
  .title:hover { color: var(--accent); text-decoration: underline; }
  .tag {
    display: inline-block; background: var(--chip); color: var(--ink-2);
    font-size: 11px; font-weight: 500; padding: 1px 6px; border-radius: 3px;
    margin-left: 6px; vertical-align: 1px;
  }
  .tag.gone { color: var(--amber); background: color-mix(in srgb, var(--amber) 14%, transparent); }
  .tag.wait { color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); }
  .tag.st { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .btn.x:hover { color: var(--red); }

  /* tabs */
  .tabs { display: flex; gap: 2px; margin: 14px 0 16px; border-bottom: 1px solid var(--line); }
  .tab {
    font: 500 13.5px Switzer, sans-serif; padding: 7px 14px 9px; cursor: pointer;
    background: transparent; border: 0; border-bottom: 2px solid transparent;
    color: var(--ink-2); margin-bottom: -1px;
  }
  .tab.on { color: var(--ink); border-bottom-color: var(--accent); }
  .tab .n { font-size: 12px; margin-left: 5px; font-variant-numeric: tabular-nums; color: var(--ink-2); }

  /* tracker */
  .trow {
    display: grid; grid-template-columns: 128px minmax(0,1fr) auto;
    gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--line);
    align-items: start;
  }
  .trow:first-child { border-top: 0; }
  .trow .meta { grid-column: 2; }
  .trow .acts { grid-row: span 2; }
  select.st {
    width: 100%; font: 500 12.5px Switzer, sans-serif; cursor: pointer;
    border: 1px solid var(--line-2); border-radius: 999px; padding: 4px 8px;
    background: var(--surface); color: var(--ink);
  }
  select.st:disabled { cursor: not-allowed; opacity: .5; }
  select.st.pending { opacity: .55; }
  select.st.s-oa, select.st.s-phone_screen { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 55%, transparent); }
  select.st.s-interview, select.st.s-offer { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  select.st.s-offer { font-weight: 600; }
  select.st.s-rejected { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, transparent); }
  select.st.s-withdrawn { color: var(--ink-2); }
  .lastnote { font-style: italic; }

  /* inbox actions (mail-sync emails needing a human) */
  .arow {
    display: grid; grid-template-columns: minmax(0,1fr);
    gap: 2px 12px; padding: 10px 12px; border-top: 1px solid var(--line);
  }
  .arow:first-child { border-top: 0; }
  .arow .meta { grid-column: 1; }
  .arow .resolve {
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    margin-top: 7px;
  }
  .arow select.cand {
    font: 500 12.5px Switzer, sans-serif; max-width: 360px;
    border: 1px solid var(--line-2); border-radius: 5px; padding: 5px 8px;
    background: var(--surface); color: var(--ink);
  }
  .arow select.st { width: auto; }
  .tag.sig { margin-left: 0; margin-right: 6px; }
  .tag.s-rejected { color: var(--red); background: color-mix(in srgb, var(--red) 12%, transparent); }
  .tag.s-oa, .tag.s-phone_screen { color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, transparent); }
  .tag.s-interview, .tag.s-offer { color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .hist { margin: 0; padding: 0; list-style: none; font-size: 13.5px; }
  .hist li { display: grid; grid-template-columns: 76px 110px minmax(0,1fr); gap: 10px; padding: 6px 0; border-top: 1px dashed var(--line); }
  .hist li:first-child { border-top: 0; }
  .hist .on { color: var(--ink-2); font-variant-numeric: tabular-nums; }
  #toasts .toast button {
    font: 600 12.5px Switzer, sans-serif; cursor: pointer; margin-left: 10px;
    background: transparent; color: inherit; border: 1px solid currentColor;
    border-radius: 4px; padding: 2px 8px;
  }
  .meta {
    grid-column: 2; color: var(--ink-2); font-size: 12.5px;
    font-variant-numeric: tabular-nums; margin-top: 1px;
  }
  .meta .short { font-family: var(--mono); font-size: 11.5px; }
  .acts { display: flex; gap: 6px; align-items: center; grid-row: span 2; }
  .acts .built { color: var(--accent); }
  .ext { width: 12px; height: 12px; vertical-align: -1px; margin-left: 3px; color: var(--ink-2); }

  /* checkbox â€” input stays in the accessibility tree, box is the visual */
  .tick { margin-top: 2px; position: relative; }
  .tick input {
    position: absolute; inset: 0; width: 16px; height: 16px;
    opacity: 0; margin: 0; cursor: pointer;
  }
  .tick input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tick span {
    display: block; width: 16px; height: 16px; border-radius: 4px;
    border: 1.5px solid var(--line-2); cursor: pointer; position: relative;
  }
  .tick input:checked + span { background: var(--accent); border-color: var(--accent); }
  .tick input:checked + span::after {
    content: ""; position: absolute; left: 4.5px; top: 1.5px;
    width: 4px; height: 8px; border: solid var(--accent-ink);
    border-width: 0 2px 2px 0; transform: rotate(42deg);
  }
  .tick input:disabled + span { opacity: .4; cursor: not-allowed; }
  .tick.save span { border-color: color-mix(in srgb, var(--amber) 55%, var(--line-2)); }
  .tick.save input:checked + span { background: var(--amber); border-color: var(--amber); }
  .tick.save input:checked + span::after { border-color: var(--accent-ink); }
  .ticks { display: flex; flex-direction: row; gap: 6px; }

  /* JD paste panel */
  .jd { grid-column: 1 / -1; margin-top: 8px; }
  .jd textarea {
    width: 100%; min-height: 130px; font: 12.5px/1.4 var(--mono);
    color: var(--ink); background: var(--bg); border: 1px solid var(--line-2);
    border-radius: 5px; padding: 8px; resize: vertical;
  }
  .jd .hint { color: var(--ink-2); font-size: 12.5px; margin: 2px 0 6px; }
  .jd .bar { display: flex; gap: 8px; margin-top: 6px; }

  .empty { padding: 28px 14px; color: var(--ink-2); text-align: center; }

  /* dialogs */
  dialog {
    border: 1px solid var(--line-2); border-radius: 8px; padding: 0;
    background: var(--surface); color: var(--ink); max-width: min(880px, 92vw);
  }
  dialog::backdrop { background: rgba(20, 18, 12, .45); }
  .dlg-head {
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; border-bottom: 1px solid var(--line);
  }
  .dlg-head b { font-size: 14px; }
  .dlg-body { padding: 14px 16px; max-height: 72vh; overflow: auto; }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .shots figure { margin: 0; }
  .shots img { width: 100%; border: 1px solid var(--line); border-radius: 4px; display: block; }
  .shots figcaption { font: 11.5px var(--mono); color: var(--ink-2); margin-top: 3px; }
  .report { font: 12.5px/1.5 var(--mono); white-space: pre-wrap; margin: 0; }

  /* toasts */
  #toasts { position: fixed; right: 16px; bottom: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 10; }
  .toast {
    background: var(--ink); color: var(--bg); padding: 9px 13px;
    border-radius: 6px; font-size: 13px; max-width: 380px;
    box-shadow: 0 4px 16px rgba(0,0,0,.18);
  }
  .toast.err { background: var(--red); color: #fff; }

  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (max-width: 640px) {
    .wrap { padding: 18px 14px 80px; }
    .row { grid-template-columns: 40px minmax(0,1fr); }
    .trow { grid-template-columns: minmax(0,1fr); }
    .row .acts, .trow .acts {
      grid-column: 1 / -1; grid-row: auto;
      justify-content: flex-start; margin-top: 6px;
    }
    .trow .meta { grid-column: 1 / -1; }
    select.st { width: auto; }
    .hist li { grid-template-columns: 70px minmax(0,1fr); }
    .hist li span:last-child { grid-column: 1 / -1; }
    .toolbar { gap: 6px; }
    input[type=search] { min-width: 0; }
  }

  /* triage dock — fixed bottom-center, acts on cursor row */
  #triage-dock {
    position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; gap: 6px; align-items: center;
    max-width: calc(100vw - 24px); width: max-content;
    border: 1px solid var(--line-2); border-radius: 8px;
    background: var(--surface); padding: 7px 8px;
    box-shadow: 0 4px 14px rgba(0,0,0,.12), 0 8px 24px rgba(0,0,0,.08);
    z-index: 9;
  }
  #triage-dock[hidden] { display: none !important; }
  #triage-dock .db {
    display: inline-flex; align-items: center; gap: 6px;
    font: 500 12.5px/1 Switzer, sans-serif; white-space: nowrap;
    border: 1px solid var(--line-2); background: var(--bg); color: var(--ink);
    border-radius: 5px; padding: 6px 10px; cursor: pointer;
  }
  #triage-dock .db:hover { border-color: var(--ink-2); }
  #triage-dock .db:disabled { opacity: .55; cursor: default; }
  #triage-dock .db.applied { color: var(--accent); }
  #triage-dock .db.save { color: var(--amber); }
  #triage-dock .db.hide { color: var(--red); }
  #triage-dock .db svg { width: 14px; height: 14px; }
  #triage-dock kbd {
    font: 500 10.5px var(--mono); border: 1px solid var(--line-2);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px;
    color: var(--ink-2); background: var(--surface);
  }
  #triage-dock .db.built { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  body.docked #list { padding-bottom: 72px; }
  body.docked .wrap { padding-bottom: 140px; }
  @media (max-width: 640px) {
    body.docked .wrap { padding-bottom: 130px; }
  }
  @media (max-width: 700px) {
    #triage-dock { gap: 4px; padding: 6px 6px; bottom: 10px; }
    #triage-dock .db { padding: 6px 8px; }
    #triage-dock .db .label { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">intern-watch <span class="user" id="who"></span></div>
    <div class="spacer"></div>
    <span class="updated" id="updated"></span>
    <a class="btn quiet" id="issue-link" target="_blank" rel="noopener" hidden>issue</a>
    <button class="btn" id="refresh"></button>
  </header>
  <div id="banners"></div>

  <nav class="tabs">
    <button class="tab on" data-tab="matches">Matches</button>
    <button class="tab" data-tab="tracker">Tracker<span class="n" id="tcount"></span></button>
    <button class="tab" data-tab="inbox" id="tab-inbox" hidden>Inbox<span class="n" id="icount"></span></button>
  </nav>

  <div id="view-matches">
    <div class="statline" id="stats"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search company, title, locationâ€¦" autocomplete="off">
      <select id="status">
        <option value="all">All</option>
        <option value="todo">To apply</option>
        <option value="applied">Applied</option>
        <option value="saved">Saved</option>
        <option value="resume">Has resume</option>
        <option value="agent">Agent touched</option>
        <option value="stale">Likely closed</option>
        <option value="hidden">Hidden</option>
      </select>
    </div>
    <div class="chips" id="terms"></div>
    <main id="list"></main>
  </div>

  <div id="view-tracker" hidden>
    <div class="funnelbar" id="funnelbar"></div>
    <div class="statline" id="funnel"></div>
    <div class="toolbar">
      <input type="search" id="tq" placeholder="Search applicationsâ€¦" autocomplete="off">
    </div>
    <div class="chips" id="tchips"></div>
    <main id="tlist"></main>
  </div>

  <div id="view-inbox" hidden>
    <main id="ilist"></main>
  </div>
</div>

<dialog id="dlg">
  <div class="dlg-head"><b id="dlg-title"></b><div class="spacer"></div>
    <button class="btn quiet" id="dlg-close"></button></div>
  <div class="dlg-body" id="dlg-body"></div>
</dialog>
<div id="toasts"></div>
<div id="triage-dock" hidden role="toolbar" aria-label="Triage">
  <button class="db applied" data-dock="applied"><kbd>x</kbd> <span class="label">applied</span></button>
  <button class="db save" data-dock="save"><kbd>s</kbd> <span class="label">save</span></button>
  <button class="db hide" data-dock="hide"><kbd>h</kbd> <span class="label">hide</span></button>
  <button class="db" data-dock="build"><kbd>b</kbd> <span class="label">build resume</span></button>
  <button class="db" data-dock="open"><kbd>&#8629;</kbd> <span class="label">open</span></button>
</div>

<script>
"use strict";

const ICON = {
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5"/></svg>',
  ext: '<svg class="ext" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  doc: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h6"/><path d="M9 13h6M9 17h6"/></svg>',
  cam: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  undo: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>',
};

// Tracker pipeline: keep in sync with src/ledger.py STATUSES.
const STATUSES = { applied: "Applied", oa: "OA", phone_screen: "Phone screen",
                   interview: "Interview", offer: "Offer",
                   rejected: "Rejected", withdrawn: "Withdrawn" };
const ACTIVE_ST = ["applied", "oa", "phone_screen", "interview"];
const GHOST_DAYS = 21;                 // untouched this long = awaiting response

// pipeline semantics for the match tags; * = judged by the LLM (cached per employer)
const TAG_TITLE = {
  TOP: "top company â€” matched by rules",
  "TOP*": "top company â€” judged by the LLM, cached per employer",
  ATL: "Atlanta metro (~35 mi) â€” matched by rules",
  "ATL*": "Atlanta metro (~35 mi) â€” judged by the LLM",
  REMOTE: "remote role",
};

let DATA = null;                       // last /api/state payload
const UI = { q: "", status: "all", term: "All",
             tab: "matches", tq: "", tfilter: "all" };
const busy = new Set();                // shorts with a build in flight
const reports = new Map();             // short -> build report markdown

// new-since-last-visit: read the prior stamp once; today is claimed only
// once data actually lands (see load), so a failed visit stays unclaimed
const LAST_VISIT = localStorage.getItem("iw-last-visit");

let loadedAt = 0;                      // ms timestamp of the last fresh data landing
let cursor = null;                     // short of the keyboard-triage cursor row

const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function toast(msg, err, action) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  if (action) {
    const b = document.createElement("button");
    b.textContent = action.label;
    b.onclick = () => { el.remove(); action.run(); };
    el.append(b);
  }
  $("#toasts").append(el);
  setTimeout(() => el.remove(), err ? 7000 : action ? 6000 : 3500);
}

async function api(path, body) {
  const resp = await fetch(path, body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify(body),
  });
  const data = await resp.json().catch(() => ({}));
  if (!resp.ok && !data.error) data.error = `HTTP ${resp.status}`;
  return data;
}

/* ---------- rendering ---------- */

function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

const likelyClosed = m => (m.stale_days ?? 0) >= 7;

function visible(m) {
  // dismissed rows live only behind the Hidden filter
  if (UI.status === "hidden" ? !m.dismissed : m.dismissed) return false;
  if (UI.term !== "All" && (m.term || "Unknown term") !== UI.term) return false;
  if (UI.status === "todo" && m.applied) return false;
  if (UI.status === "applied" && !m.applied) return false;
  if (UI.status === "saved" && !m.saved) return false;
  if (UI.status === "resume" && !(m.resume || m.resume_url || m.local_resume)) return false;
  if (UI.status === "agent" && !m.artifacts) return false;
  if (UI.status === "stale" && !likelyClosed(m)) return false;
  if (UI.q) {
    const hay = `${m.company} ${m.title} ${m.location} ${m.short}`.toLowerCase();
    if (!hay.includes(UI.q)) return false;
  }
  return true;
}

/* ---------- dismiss coalescing ---------- */

// Batch-hide: every hide/restore lands in this Map (short -> desired
// dismissed state, last write wins) and is flushed in one burst of at most
// two POSTs (one per direction). A hide-then-undo before the flush sends
// nothing. Rows disappear optimistically at enqueue time, not flush time,
// so a rapid `h h h` keypress stream removes them without a full re-render.
const dismissQueue = new Map();
const FLUSH_IDLE = 500;          // debounce: 500ms after the last enqueue
const FLUSH_MAX = 3000;          // hard ceiling from the burst's first write
const FLUSH_CAP = 50;            // immediate flush at this many queued
let dismissTimer = null;
let dismissDeadline = 0;
let dismissBusy = false;         // a flush is in flight (serialize requests)
// the live undo toast covering the current hide burst, or null when sealed
let dismissBurst = null;

function statsHtml() {
  const ms = DATA.matches;
  const active = ms.filter(m => !m.dismissed);
  const applied = active.filter(m => m.applied).length;
  const saved = active.filter(m => m.saved).length;
  const resumes = active.filter(m => m.resume || m.resume_url || m.local_resume).length;
  const hidden = ms.length - active.length;
  const stat = (n, label, f) =>
    `<span class="seg" data-stat="${f}"><b>${n}</b> ${label}</span>`;
  return stat(active.length, "matches", "all") + " Â· " +
    stat(applied, "applied", "applied") + " Â· " +
    stat(active.length - applied, "to go", "todo") + " Â· " +
    stat(resumes, "resumes", "resume") +
    (saved ? " Â· " + stat(saved, "saved", "saved") : "") +
    (hidden ? " Â· " + stat(hidden, "hidden", "hidden") : "");
}

// update the statline + a row's term-section count in place, without the
// full re-render that a hide would otherwise need
function renderStats() { $("#stats").innerHTML = statsHtml(); }

function scheduleDismissFlush() {
  if (!dismissQueue.size || dismissBusy) return;
  if (dismissQueue.size >= FLUSH_CAP) {
    if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
    dismissFlush();
    return;
  }
  if (!dismissTimer) dismissDeadline = Date.now() + FLUSH_MAX;
  clearTimeout(dismissTimer);
  const delay = Math.max(0, Math.min(FLUSH_IDLE, dismissDeadline - Date.now()));
  dismissTimer = setTimeout(() => { dismissTimer = null; dismissFlush(); }, delay);
}

async function postShorts(shorts, value) {
  const res = await api("/api/dismissed", { shorts, dismissed: value });
  if (res.error) throw Object.assign(new Error(res.error), { shorts, value });
  return res;
}

function dismissFlush() {
  if (dismissTimer) { clearTimeout(dismissTimer); dismissTimer = null; }
  if (!dismissQueue.size || dismissBusy) return;
  const hid = [], res = [];
  for (const [s, v] of dismissQueue) (v ? hid : res).push(s);
  dismissBusy = true;
  (async () => {
    let failed = false;
    try {
      if (hid.length) {
        const r = await postShorts(hid, true);
        for (const s of hid) if (dismissQueue.get(s) === true) dismissQueue.delete(s);
        syncToast(r);
      }
      if (res.length) {
        const r = await postShorts(res, false);
        for (const s of res) if (dismissQueue.get(s) === false) dismissQueue.delete(s);
        syncToast(r);
      }
    } catch (e) {
      failed = true;
      // rollback exactly the failed request's shorts, then settle to server truth
      for (const s of e.shorts) {
        if (dismissQueue.get(s) === e.value) dismissQueue.delete(s);
        const m = DATA.matches.find(m => m.short === s);
        if (m) m.dismissed = !e.value;
      }
      render();
      toast(e.message || "couldn't sync hides", true);
    } finally {
      dismissBusy = false;
      // keep draining only when nothing errored; an error bubbles a toast and
      // reschedules on the user's next hide rather than error-looping
      if (!failed && dismissQueue.size) scheduleDismissFlush();
    }
  })();
}

// append " (N syncing)" to a live burst toast when a flush response reports
// queued (off-window) rows that only land after a workflow commit
function syncToast(r) {
  const q = (r && r.queued) || [];
  if (dismissBurst && !dismissBurst.dead && q.length) {
    dismissBurst.sync += q.length;
    paintBurst();
  }
}

function paintBurst() {
  if (!dismissBurst) return;
  const n = dismissBurst.shorts.size;
  dismissBurst.txt.nodeValue = "Hidden " + n +
    (dismissBurst.sync ? " (" + dismissBurst.sync + " syncing - land in ~1 min)" : "");
}

function sealBurst() {
  if (!dismissBurst) return;
  if (dismissBurst.timer) clearTimeout(dismissBurst.timer);
  dismissBurst.el.remove();
  dismissBurst.dead = true;
}

// one live undo toast per hide burst; a new hide extends it and resets the
// 6s lifetime, an idle 6s seals it (per-row restore stays on the Hidden tab)
function extendBurst(short) {
  if (!dismissBurst || dismissBurst.dead) {
    const el = document.createElement("div");
    el.className = "toast";
    dismissBurst = { el, txt: document.createTextNode(""),
                     shorts: new Set(), sync: 0, dead: false, timer: null };
    el.append(dismissBurst.txt);
    const b = document.createElement("button");
    b.textContent = "Undo";
    b.onclick = () => { sealBurst(); undoBurst(); };
    el.append(b);
    $("#toasts").append(el);
  }
  dismissBurst.shorts.add(short);
  if (dismissBurst.timer) clearTimeout(dismissBurst.timer);
  dismissBurst.timer = setTimeout(sealBurst, 6000);
  paintBurst();
}

// undo the WHOLE burst: un-hide every short it covered, whether still
// queued (just drop it - zero network) or already flushed (restore it)
function undoBurst() {
  if (!dismissBurst || dismissBurst.dead) return;
  const shorts = [...dismissBurst.shorts];
  let needsFlush = false;
  for (const s of shorts) {
    const v = dismissQueue.get(s);
    if (v === true) dismissQueue.delete(s);
    else if (v === false) { /* restore already queued */ }
    else { dismissQueue.set(s, false); needsFlush = true; }
  }
  for (const m of DATA.matches)
    if (shorts.includes(m.short)) m.dismissed = false;
  render();
  if (needsFlush) scheduleDismissFlush();
}

function queueDismiss(short, dismissed) {
  const m = DATA.matches.find(m => m.short === short);
  if (!m || m.dismissed === dismissed) return;
  dismissQueue.set(short, dismissed);
  m.dismissed = dismissed;
  if (dismissed) {
    hideRow(short);
    extendBurst(short);
  } else {
    render();   // restoring needs the row back in the list
  }
  scheduleDismissFlush();
}

// remove one row's DOM node + update the counts in place (no full render)
function hideRow(short) {
  const row = document.getElementById("r-" + short);
  if (row) {
    const sec = row.closest("section");
    if (sec) {
      const n = $(".n", sec);
      if (n) n.textContent = Math.max(0, (parseInt(n.textContent, 10) || 1) - 1);
    }
    row.remove();
  }
  renderStats();
  applyCursor();
}

// send any queued writes through a beacon on navigation - fire-and-forget,
// idempotent if a later flush re-sends them
function shipDismissQueue() {
  if (!dismissQueue.size) return;
  const hid = [], res = [];
  for (const [s, v] of dismissQueue) (v ? hid : res).push(s);
  const beacon = (shorts, value) => shorts.length && navigator.sendBeacon(
    "/api/dismissed",
    new Blob([JSON.stringify({ shorts, dismissed: value })],
             { type: "application/json" }));
  beacon(hid, true);
  beacon(res, false);
}
window.addEventListener("pagehide", shipDismissQueue);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") shipDismissQueue();
});

function render() {
  if (!DATA) return;
  const ms = DATA.matches;

  $("#who").textContent = "â€” " + DATA.user;
  renderStats();
  const t = new Date(DATA.generated);
  $("#updated").textContent = "as of " +
    t.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) +
    (DATA.fetched_main ? "" : " (local copy)");

  const link = $("#issue-link");
  if (DATA.issue && DATA.issue.url) {
    link.hidden = false;
    link.href = DATA.issue.url;
    link.innerHTML = `#${DATA.issue.number}${ICON.ext}`;
  } else link.hidden = true;

  $("#banners").innerHTML = (DATA.warnings || [])
    .map(w => `<div class="banner">${esc(w)}</div>`).join("");

  // term chips: configured order first, then whatever else appears
  const inData = [...new Set(ms.map(m => m.term || "Unknown term"))];
  const terms = ["All",
    ...DATA.terms_order.filter(t => inData.includes(t)),
    ...inData.filter(t => !DATA.terms_order.includes(t)).sort()];
  $("#terms").innerHTML = terms.map(t =>
    `<button class="chip ${UI.term === t ? "on" : ""}" data-term="${esc(t)}">${esc(t)}</button>`).join("");

  const shown = ms.filter(visible);
  const byTerm = new Map();
  for (const m of shown) {
    const k = m.term || "Unknown term";
    if (!byTerm.has(k)) byTerm.set(k, []);
    byTerm.get(k).push(m);
  }
  const order = terms.slice(1).filter(t => byTerm.has(t));
  $("#list").innerHTML = order.map(t => {
    const group = byTerm.get(t).sort((a, b) =>
      (b.added || "").localeCompare(a.added || "") ||
      a.company.localeCompare(b.company));
    return `<section><h2>${esc(t)}<span class="n">${group.length}</span></h2>
      <div class="rows">${group.map(rowHtml).join("")}</div></section>`;
  }).join("") || `<div class="rows empty">Nothing matches the current filters.</div>`;

  renderTracker();
  renderInbox();                 // may bounce UI.tab off a vanished inbox
  $("#view-matches").hidden = UI.tab !== "matches";
  $("#view-tracker").hidden = UI.tab !== "tracker";
  $("#view-inbox").hidden = UI.tab !== "inbox";
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("on", t.dataset.tab === UI.tab));
  applyCursor();
  updateDock();
}

/* ---------- tracker ---------- */

const lastActivity = rec => {
  const h = rec.history || [];
  return h.length ? h[h.length - 1].on : rec.applied;
};
const waitingDays = rec => {
  if (!ACTIVE_ST.includes(rec.status)) return 0;
  const d = new Date(lastActivity(rec) + "T00:00:00");
  return Math.floor((Date.now() - d.getTime()) / 864e5);
};
const lastNote = rec =>
  (rec.history || []).map(e => e.note).filter(Boolean).pop() || "";

function tvisible(short, rec) {
  if (UI.tfilter === "waiting" && waitingDays(rec) < GHOST_DAYS) return false;
  if (STATUSES[UI.tfilter] && rec.status !== UI.tfilter) return false;
  if (UI.tq) {
    const hay = `${rec.company} ${rec.title} ${lastNote(rec)} ${short}`.toLowerCase();
    if (!hay.includes(UI.tq)) return false;
  }
  return true;
}

function trowHtml([short, rec]) {
  const canWrite = DATA.issue && DATA.issue.writable;
  const wd = waitingDays(rec);
  const wait = wd >= GHOST_DAYS
    ? `<span class="tag gone" title="no status change in ${wd} days">no response ${wd}d</span>`
    : ACTIVE_ST.includes(rec.status) && wd >= 10
      ? `<span class="tag wait" title="no status change in ${wd} days">waiting ${wd}d</span>` : "";
  const note = lastNote(rec);
  const opts = Object.entries(STATUSES).map(([v, label]) =>
    `<option value="${v}" ${v === rec.status ? "selected" : ""}>${label}</option>`).join("");
  const resume = rec.resume && rec.resume.startsWith("resumes/")
    ? `<a class="btn quiet" title="tailored resume" href="/files/repo/${encodeURI(rec.resume)}">${ICON.doc}</a>` : "";
  return `<div class="trow" id="t-${short}">
    <select class="st s-${esc(rec.status)}${rec.pending ? " pending" : ""}"
            data-setst="${short}" ${canWrite ? "" : "disabled"}
            title="${canWrite ? "status â€” commits via the dashboard-write workflow" : "read-only (no GitHub token)"}">${opts}</select>
    <div class="head">
      <span class="company">${esc(rec.company)}</span>${wait}
      â€” <a class="title" href="${esc(rec.url)}" target="_blank" rel="noopener">${esc(rec.title)}${ICON.ext}</a>
    </div>
    <div class="acts">${resume}
      <button class="btn quiet" data-tnote="${short}">${ICON.plus} note</button>
      <button class="btn quiet" data-thist="${short}">history</button>
    </div>
    <div class="meta">applied ${fmtDate(rec.applied)} Â· last activity ${fmtDate(lastActivity(rec))}${rec.pending ? " Â· syncingâ€¦" : ""}${note ? ` Â· <span class="lastnote">${esc(note)}</span>` : ""}</div>
  </div>`;
}

function renderTracker() {
  const entries = Object.entries(DATA.applications || {});
  $("#tcount").textContent = entries.length || "";

  const counts = {};
  let waiting = 0;
  for (const [, rec] of entries) {
    counts[rec.status] = (counts[rec.status] || 0) + 1;
    if (waitingDays(rec) >= GHOST_DAYS) waiting++;
  }
  const present = Object.entries(STATUSES).filter(([v]) => counts[v]);
  const bar = $("#funnelbar");
  bar.hidden = !present.length;
  bar.innerHTML = present.map(([v, label]) =>
    `<span class="fb-${v}" style="flex:${counts[v]}" title="${counts[v]} ${esc(label.toLowerCase())}"></span>`).join("");
  const seg = (v, n, label) =>
    `<span class="seg" data-tstat="${v}"><b>${n}</b> ${esc(label)}</span>`;
  $("#funnel").innerHTML = present
    .map(([v, label]) => seg(v, counts[v], label.toLowerCase()))
    .join(" Â· ") + (waiting ? " Â· " + seg("waiting", waiting, "awaiting response") : "");

  const chips = [["all", "All"],
    ...Object.entries(STATUSES).filter(([v]) => counts[v]),
    ...(waiting ? [["waiting", `Awaiting ${GHOST_DAYS}d+`]] : [])];
  $("#tchips").innerHTML = chips.map(([v, label]) =>
    `<button class="chip ${UI.tfilter === v ? "on" : ""}" data-tfilter="${v}">${esc(label)}</button>`).join("");

  const shown = entries.filter(([s, r]) => tvisible(s, r))
    .sort((a, b) => lastActivity(b[1]).localeCompare(lastActivity(a[1])) ||
                    a[1].company.localeCompare(b[1].company));
  $("#tlist").innerHTML = shown.length
    ? `<div class="rows">${shown.map(trowHtml).join("")}</div>`
    : `<div class="rows empty">${entries.length
        ? "Nothing matches the current filters."
        : "No applications yet â€” tick a match as applied and it lands here permanently."}</div>`;
}

/* ---------- inbox (mail-sync emails needing a human) ---------- */

// '"Acme Recruiting" <no-reply@acme.com>' -> { name, addr }
function fromParts(from) {
  const m = /^\s*"?([^"<]*?)"?\s*<([^>]+)>\s*$/.exec(from || "");
  return m ? { name: m[1].trim(), addr: m[2].trim() }
           : { name: "", addr: (from || "").trim() };
}

const gmailLink = a =>
  "https://mail.google.com/mail/?authuser=" +
  encodeURIComponent(a.accountEmail || "") +
  "#all/" + encodeURIComponent(a.gmailMessageId);

// preselect the top candidate only when it is decisively ahead of the
// runner-up (same bar the backend uses before it would auto-apply)
const decisive = c =>
  c.length > 0 && c[0].score >= 3 &&
  (c.length === 1 || c[1].score * 2 <= c[0].score);

function arowHtml(a) {
  const f = fromParts(a.from);
  const cands = a.candidates || [];
  const pick = decisive(cands);
  const options = [
    `<option value="" ${pick ? "" : "selected"} disabled>match to applicationâ€¦</option>`,
    ...cands.map((c, i) =>
      `<option value="${esc(c.short)}" ${pick && i === 0 ? "selected" : ""}>${esc(c.company)} â€” ${esc(c.title)}</option>`),
    `<option value="__all">other applicationâ€¦</option>`,
  ].join("");
  const sts = Object.entries(STATUSES).map(([v, label]) =>
    `<option value="${v}" ${v === a.signal ? "selected" : ""}>${label}</option>`).join("");
  const who = cands.length ? cands[0].company : (f.name || f.addr);
  return `<div class="arow" id="a-${esc(a.id)}">
    <div class="head">
      <span class="tag sig s-${esc(a.signal)}">${esc(STATUSES[a.signal] || a.signal)}</span>
      <span class="company">${esc(who)}</span>
      â€” <a class="title" href="${esc(gmailLink(a))}" target="_blank" rel="noopener" title="open the email in Gmail">${esc(a.subject || "(no subject)")}${ICON.ext}</a>
    </div>
    <div class="meta">${esc(f.addr)} Â· ${fmtDate((a.receivedAt || "").slice(0, 10))}${
      a.evidence ? ` Â· <span class="lastnote">â€œ${esc(a.evidence)}â€</span>` : ""}${
      a.source === "llm" ? ` Â· <span class="tag" title="signal from the LLM fallback, not the regex rules">llm</span>` : ""}</div>
    <div class="resolve">
      <select class="cand" data-acand="${esc(a.id)}">${options}</select>
      <select class="st s-${esc(a.signal)}">${sts}</select>
      <button class="btn" data-aresolve="${esc(a.id)}">apply</button>
      <button class="btn quiet" data-adismiss="${esc(a.id)}">dismiss</button>
    </div>
  </div>`;
}

function renderInbox() {
  const inbox = DATA.inbox_actions;
  $("#tab-inbox").hidden = inbox == null;
  if (inbox == null) {
    if (UI.tab === "inbox") UI.tab = "matches";  // store stopped serving it
    return;
  }
  const actions = inbox.actions || [];
  $("#icount").textContent = actions.length || "";
  $("#ilist").innerHTML = actions.length
    ? `<div class="rows">${actions.map(arowHtml).join("")}</div>`
    : `<div class="rows empty">No inbox actions. Recruiter emails the mail
       sync can't match to an application on its own land here.</div>`;
}

// optimistic remove -> POST /api/action -> restore the row on error
async function finishAction(id, body, okMsg, onOk) {
  const list = DATA.inbox_actions.actions;
  const i = list.findIndex(a => a.id === id);
  if (i < 0) return;
  const [a] = list.splice(i, 1);
  render();
  const res = await api("/api/action", body);
  if (res.error) {
    list.splice(i, 0, a);
    render();
    toast(res.error, true);
    return;
  }
  if (onOk) onOk(a);
  render();
  toast(okMsg);
}

function resolveAction(id) {
  const row = document.getElementById("a-" + id);
  const short = $("select.cand", row).value;
  const status = $("select.st", row).value;
  if (!short || short === "__all") {
    toast("pick the application this email is about", true);
    return;
  }
  finishAction(id, { id, short, status }, `${STATUSES[status]} recorded`, () => {
    // mirror setStatus's optimistic bookkeeping so the tracker agrees
    const rec = DATA.applications[short];
    if (rec) { rec.status = status; rec.pending = true; }
    const m = (DATA.matches || []).find(m => m.short === short);
    if (m) { m.status = status; m.applied = true; }
  });
}

/* ---------- actions ---------- */

async function load(refresh) {
  const btn = $("#refresh");
  btn.disabled = true;
  btn.innerHTML = `<span class="spin">${ICON.refresh}</span> refresh`;
  DATA = refresh ? await api("/api/refresh", {}) : await api("/api/state");
  btn.disabled = false;
  btn.innerHTML = `${ICON.refresh} refresh`;
  if (DATA.error) { toast(DATA.error, true); return; }
  loadedAt = Date.now();
  localStorage.setItem("iw-last-visit", new Date().toISOString().slice(0, 10));
  checkStale();
  render();
}

// the watcher cron runs every 2h; flag the header once data outlives one cycle
function checkStale() {
  const el = $("#updated");
  const stale = loadedAt && Date.now() - loadedAt > 2 * 3600e3;
  el.classList.toggle("stale", stale);
  el.title = stale ? "data is older than one cron cycle â€” hit refresh" : "";
}
setInterval(checkStale, 60e3);

async function setApplied(short, applied, input) {
  const m = DATA.matches.find(m => m.short === short);
  m.applied = applied;            // optimistic
  render();
  const res = await api("/api/applied", { short, applied });
  if (res.error) {
    m.applied = !applied;
    render();
    toast(res.error, true);
  } else if (res.queued) {
    toast("Row is off the issue â€” queued a state write, lands in ~1 min");
  }
}

async function setSaved(short, saved) {
  const m = DATA.matches.find(m => m.short === short);
  m.saved = saved;                // optimistic
  render();
  const res = await api("/api/saved", { short, saved });
  if (res.error) {
    m.saved = !saved;
    render();
    toast(res.error, true);
  } else if (res.queued) {
    toast("Row is off the issue â€” queued a state write, lands in ~1 min");
  }
}

async function setStatus(short, status, note) {
  const rec = DATA.applications[short];
  const prev = rec.status;
  rec.status = status;            // optimistic; overlay confirms after commit
  rec.pending = true;
  const m = DATA.matches.find(m => m.short === short);
  if (m) { m.status = status; m.applied = true; }
  render();
  const res = await api("/api/status", { short, status, note: note || "" });
  if (res.error) {
    rec.status = prev;
    rec.pending = false;
    if (m) m.status = prev;
    render();
    toast(res.error, true);
  } else {
    toast(`${STATUSES[status]}${note ? " + note" : ""} queued â€” lands in ~1 min`);
  }
}

function notePanel(short) {
  const row = $("#t-" + short);
  if (!row || $(".jd", row)) return;
  const div = document.createElement("div");
  div.className = "jd";
  div.innerHTML = `<textarea rows="2" style="min-height:52px"
      placeholder="Note for the history â€” e.g. 'OA due Friday', 'recruiter: Sam'"></textarea>
    <div class="bar">
      <button class="btn" data-tnotego="${short}">save note</button>
      <button class="btn quiet" data-jdx>cancel</button>
    </div>`;
  row.append(div);
  $("textarea", div).focus();
}

function showHistory(short) {
  const rec = DATA.applications[short];
  $("#dlg-title").textContent = `${rec.company} â€” history`;
  $("#dlg-body").innerHTML = `<ul class="hist">` +
    (rec.history || []).slice().reverse().map(e =>
      `<li><span class="on">${fmtDate(e.on)}</span>
       <span>${esc(STATUSES[e.status] || e.status)}</span>
       <span>${esc(e.note || "")}</span></li>`).join("") + `</ul>`;
  $("#dlg").showModal();
}

async function build(short, jdText) {
  busy.add(short);
  render();
  const res = await api("/api/resume", { short, jd_text: jdText || "" });
  busy.delete(short);
  if (res.ok) {
    const m = DATA.matches.find(m => m.short === short);
    m.local_resume = res.file;
    reports.set(short, res.report);
    render();
    toast(`Resume built (${res.pages} pages${res.used_llm ? ", LLM rewrite" : ""})`);
  } else if (res.needs_jd) {
    render();
    jdPanel(short, res.error);
  } else {
    render();
    toast(res.error || "build failed", true);
  }
}

function jdPanel(short, why) {
  const row = $("#r-" + short);
  if (!row || $(".jd", row)) return;
  const div = document.createElement("div");
  div.className = "jd";
  div.innerHTML = `<div class="hint">${esc(why)}</div>
    <textarea placeholder="Paste the full job description hereâ€¦"></textarea>
    <div class="bar">
      <button class="btn" data-jdgo="${short}">${ICON.doc} build with pasted JD</button>
      <button class="btn quiet" data-jdx>cancel</button>
    </div>`;
  row.append(div);
  $("textarea", div).focus();
}

function showShots(m) {
  $("#dlg-title").textContent = `${m.company} â€” apply-run screenshots`;
  $("#dlg-body").innerHTML = `<div class="shots">` + m.artifacts.map(g =>
    g.files.map(f => {
      const src = `/files/artifacts/${encodeURIComponent(g.run)}/${encodeURIComponent(g.slug)}/${encodeURIComponent(f)}`;
      return `<figure><a href="${src}" target="_blank"><img src="${src}" loading="lazy"></a>
        <figcaption>${esc(g.run)}/${esc(g.slug)}/${esc(f)}</figcaption></figure>`;
    }).join("")).join("") + `</div>`;
  $("#dlg").showModal();
}

function showReport(short) {
  const m = DATA.matches.find(m => m.short === short);
  $("#dlg-title").textContent = `Build report â€” ${m.company}`;
  $("#dlg-body").innerHTML = `<pre class="report">${esc(reports.get(short))}</pre>`;
  $("#dlg").showModal();
}

/* ---------- wiring ---------- */

$("#refresh").innerHTML = `${ICON.refresh} refresh`;
$("#dlg-close").innerHTML = ICON.x;
$("#dlg-close").onclick = () => $("#dlg").close();
$("#refresh").onclick = () => load(true);
$("#q").oninput = e => { UI.q = e.target.value.trim().toLowerCase(); render(); };
$("#status").onchange = e => { UI.status = e.target.value; render(); };
$("#tq").oninput = e => { UI.tq = e.target.value.trim().toLowerCase(); render(); };

document.addEventListener("click", e => {
  const t = e.target.closest("[data-term],[data-build],[data-shots],[data-report],[data-jdgo],[data-jdx],[data-dismiss],[data-restore],[data-tab],[data-tfilter],[data-tnote],[data-tnotego],[data-thist],[data-stat],[data-tstat],[data-aresolve],[data-adismiss]");
  if (!t) return;
  if (t.dataset.term) { UI.term = t.dataset.term; render(); }
  else if (t.dataset.stat) { UI.status = t.dataset.stat; $("#status").value = t.dataset.stat; render(); }
  else if (t.dataset.tstat) { UI.tfilter = t.dataset.tstat; render(); }
  else if (t.dataset.tab) { UI.tab = t.dataset.tab; render(); }
  else if (t.dataset.tfilter) { UI.tfilter = t.dataset.tfilter; render(); }
  else if (t.dataset.tnote) notePanel(t.dataset.tnote);
  else if (t.dataset.thist) showHistory(t.dataset.thist);
  else if (t.dataset.tnotego) {
    const note = $("textarea", t.closest(".jd")).value.trim();
    if (!note) { toast("write the note first", true); return; }
    const short = t.dataset.tnotego;
    t.closest(".jd").remove();
    setStatus(short, DATA.applications[short].status, note);
  }
  else if (t.dataset.dismiss) queueDismiss(t.dataset.dismiss, true);
  else if (t.dataset.restore) queueDismiss(t.dataset.restore, false);
  else if (t.dataset.aresolve) resolveAction(t.dataset.aresolve);
  else if (t.dataset.adismiss)
    finishAction(t.dataset.adismiss, { id: t.dataset.adismiss, dismiss: true },
                 "dismissed");
  else if (t.dataset.build) build(t.dataset.build);
  else if (t.dataset.shots) showShots(DATA.matches.find(m => m.short === t.dataset.shots));
  else if (t.dataset.report) showReport(t.dataset.report);
  else if (t.dataset.jdgo) {
    const jd = $("textarea", t.closest(".jd")).value.trim();
    if (!jd) { toast("paste the JD first", true); return; }
    t.closest(".jd").remove();
    build(t.dataset.jdgo, jd);
  }
  else if ("jdx" in t.dataset) t.closest(".jd").remove();
});

document.addEventListener("change", e => {
  if (e.target.dataset.applied)
    setApplied(e.target.dataset.applied, e.target.checked, e.target);
  else if (e.target.dataset.saved)
    setSaved(e.target.dataset.saved, e.target.checked);
  else if (e.target.dataset.setst)
    setStatus(e.target.dataset.setst, e.target.value);
  else if (e.target.dataset.acand && e.target.value === "__all") {
    // "other applicationâ€¦": swap the shortlist for every tracked application
    e.target.innerHTML = [
      `<option value="" selected disabled>all applicationsâ€¦</option>`,
      ...Object.entries(DATA.applications || {})
        .sort((x, y) => x[1].company.localeCompare(y[1].company))
        .map(([s, r]) =>
          `<option value="${esc(s)}">${esc(r.company)} â€” ${esc(r.title)}</option>`),
    ].join("");
  }
});

/* ---------- keyboard triage ---------- */

// per-tab row geometry: container, row selector, element-id prefix
const TAB_ROWS = {
  matches: { box: "#list", row: ".row", pfx: "r-" },
  tracker: { box: "#tlist", row: ".trow", pfx: "t-" },
  inbox: { box: "#ilist", row: ".arow", pfx: "a-" },
};

// visible cursorable rows of the active tab, in DOM order
const cursorRows = () =>
  [...$(TAB_ROWS[UI.tab].box).querySelectorAll(TAB_ROWS[UI.tab].row)];
const rowShort = row => row.id.slice(2);          // "r-abc"/"t-abc" -> "abc"

function dockResumeHref(m) {
  if (!m) return null;
  if (m.local_resume) return "/files/out/" + encodeURIComponent(m.local_resume);
  if (m.resume_url) return m.resume_url;
  if (m.resume && m.resume.startsWith("resumes/")) return "/files/repo/" + encodeURI(m.resume);
  return null;
}
function ensureDockCursor() {
  if (cursor) return cursor;
  const rows = cursorRows();
  if (!rows.length) return null;
  cursor = rowShort(rows[0]);
  applyCursor();
  return cursor;
}
function advanceDockCursor() {
  const rows = cursorRows();
  const i = rows.findIndex(r => rowShort(r) === cursor);
  if (i < 0) return;
  const nxt = rows[i + 1];
  if (nxt) {
    cursor = rowShort(nxt);
    applyCursor();
    nxt.scrollIntoView({ block: "nearest" });
  }
}
function updateDockBuildState() {
  const dock = document.getElementById("triage-dock");
  if (!dock || dock.hidden) return;
  const short = cursor || (cursorRows()[0] ? rowShort(cursorRows()[0]) : null);
  const m = short ? DATA.matches.find(mm => mm.short === short) : null;
  const btn = dock.querySelector('[data-dock="build"]');
  if (!btn || !m) return;
  const isBusy = busy.has(m.short);
  const href = dockResumeHref(m);
  const hasResume = !!href;
  if (isBusy) {
    btn.disabled = true;
    btn.classList.remove("built");
    btn.innerHTML = '<kbd>b</kbd> <span class="spin">' + ICON.refresh + '</span> <span class="label">building…</span>';
  } else if (hasResume) {
    btn.disabled = false;
    btn.classList.add("built");
    btn.innerHTML = '<kbd>b</kbd> ' + ICON.doc + ' <span class="label">resume</span>';
  } else {
    btn.disabled = false;
    btn.classList.remove("built");
    btn.innerHTML = '<kbd>b</kbd> ' + ICON.doc + ' <span class="label">build resume</span>';
  }
}
function updateDock() {
  const dock = document.getElementById("triage-dock");
  if (!dock) return;
  const onMatches = UI.tab === "matches";
  const rows = onMatches ? cursorRows() : [];
  const show = onMatches && rows.length > 0;
  dock.hidden = !show;
  document.body.classList.toggle("docked", show);
  if (show) updateDockBuildState();
}

function applyCursor() {
  document.querySelectorAll(".row.cur, .trow.cur, .arow.cur")
    .forEach(r => r.classList.remove("cur"));
  if (!cursor) { updateDockBuildState(); return; }
  const row = document.getElementById(TAB_ROWS[UI.tab].pfx + cursor);
  if (row) row.classList.add("cur");
  else cursor = null;
  updateDockBuildState();
}

function moveCursor(delta) {
  const rows = cursorRows();
  if (!rows.length) return;
  let i = rows.findIndex(r => rowShort(r) === cursor);
  i = i < 0 ? (delta > 0 ? 0 : rows.length - 1)
            : Math.max(0, Math.min(rows.length - 1, i + delta));
  cursor = rowShort(rows[i]);
  applyCursor();
  rows[i].scrollIntoView({ block: "nearest" });
}

document.addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || $("#dlg").open) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === "/") { e.preventDefault(); $(UI.tab === "matches" ? "#q" : "#tq").focus(); return; }
  if (k === "j") { e.preventDefault(); moveCursor(1); return; }
  if (k === "k") { e.preventDefault(); moveCursor(-1); return; }
  if (k === "Escape") { cursor = null; applyCursor(); return; }
  if (!cursor) return;
  if (k === "Enter") {
    const a = $(".title", document.getElementById(TAB_ROWS[UI.tab].pfx + cursor));
    if (a) window.open(a.href, "_blank", "noopener");
    return;
  }
  if (UI.tab !== "matches") return;
  if (k === "x") {
    const box = $(`#r-${cursor} input[data-applied]`);
    if (!box) return;
    if (box.disabled) { toast("read-only (no GitHub token)", true); return; }
    setApplied(cursor, !box.checked, box);
    advanceDockCursor();
  } else if (k === "h") {
    // move the cursor to the next visible row (previous if this was last)
    // BEFORE the row is removed, so `h h h` streams down the list
    const rows = cursorRows();
    const i = rows.findIndex(r => rowShort(r) === cursor);
    if (i < 0) return;
    const next = rows[i + 1] || rows[i - 1];
    cursor = next ? rowShort(next) : null;
    queueDismiss(rowShort(rows[i]), true);
  } else if (k === "s") {
    const box = $(`#r-${cursor} input[data-saved]`);
    if (!box) return;
    if (box.disabled) { toast("read-only (no GitHub token)", true); return; }
    setSaved(cursor, !box.checked);
    advanceDockCursor();
  } else if (k === "b") {
    const short = cursor;
    const m = DATA.matches.find(mm => mm.short === short);
    if (!m) return;
    if (busy.has(short)) return;
    const href = dockResumeHref(m);
    if (href) window.open(href, "_blank", "noopener");
    else build(short);
  }
});

document.getElementById("triage-dock").addEventListener("click", e => {
  const btn = e.target.closest("[data-dock]");
  if (!btn) return;
  const act = btn.dataset.dock;
  if (act === "applied") {
    const cur = ensureDockCursor();
    if (!cur) return;
    const box = document.getElementById("r-" + cur)?.querySelector("input[data-applied]");
    if (!box) return;
    if (box.disabled) { toast("read-only (no GitHub token)", true); return; }
    setApplied(cur, !box.checked, box);
    advanceDockCursor();
  } else if (act === "save") {
    const cur = ensureDockCursor();
    if (!cur) return;
    const box = document.getElementById("r-" + cur)?.querySelector("input[data-saved]");
    if (!box) return;
    if (box.disabled) { toast("read-only (no GitHub token)", true); return; }
    setSaved(cur, !box.checked);
    advanceDockCursor();
  } else if (act === "hide") {
    const cur = ensureDockCursor();
    if (!cur) return;
    const rows = cursorRows();
    const i = rows.findIndex(r => rowShort(r) === cur);
    if (i < 0) return;
    const next = rows[i + 1] || rows[i - 1];
    cursor = next ? rowShort(next) : null;
    queueDismiss(rowShort(rows[i]), true);
  } else if (act === "build") {
    const cur = ensureDockCursor();
    if (!cur) return;
    const m = DATA.matches.find(mm => mm.short === cur);
    if (!m) return;
    if (busy.has(cur)) return;
    const href = dockResumeHref(m);
    if (href) window.open(href, "_blank", "noopener");
    else build(cur);
  } else if (act === "open") {
    const cur = ensureDockCursor();
    if (!cur) return;
    const row = document.getElementById("r-" + cur);
    const a = row ? row.querySelector(".title") : null;
    if (a) window.open(a.href, "_blank", "noopener");
  }
});

load(false);
</script>
