# Source registry. Adding/removing a source is config, not code.
# url template: https://raw.githubusercontent.com/{repo}/{branch}/{file}
#
# default_terms: per-file hint applied (confidence "inferred") when a row's
# title carries no term signal of its own.
#
# A source's (or ats board's) first successful fetch seeds its current
# listings instead of delivering them (src/seeding.py); `backfill: true` on
# the row delivers that backlog instead.

sources:
  - name: simplify
    adapter: simplify_json
    repo: SimplifyJobs/Summer2027-Internships
    branch: dev
    files: [".github/scripts/listings.json"]
    # Single JSON carries ALL terms (Fall 2026, Spring 2027, Summer 2027, ...)
    # and backs both README.md and README-Off-Season.md, so the off-season
    # list needs no row of its own. The 2026 repo was renamed to this one
    # (GitHub redirects the old name). Keep `name: simplify`: state "sources"
    # arrays and _meta.source_rows/source_health are keyed by name.

  # jobright-ai has not published 2027-named repos (checked 2026-11-08); the
  # 2026-* repos below are still the live ones and carry 2027 postings.
  - name: jobright-swe
    adapter: jobright_md
    repo: jobright-ai/2026-Software-Engineer-Internship
    branch: master
    files: ["README.md"]

  - name: jobright-eng
    adapter: jobright_md
    repo: jobright-ai/2026-Engineer-Internship
    branch: master
    files: ["README.md"]

  - name: jobright-pm
    adapter: jobright_md
    repo: jobright-ai/2026-Product-Management-Internship
    branch: master
    files: ["README.md"]

  - name: jobright-data
    adapter: jobright_md
    repo: jobright-ai/2026-Data-Analysis-Internship
    branch: master
    files: ["README.md"]
    # Data Scientist / analytics internships land here, NOT in the SWE or
    # Engineer repos (Universal's "Data Scientist, Commercial Audience
    # Science" only ever appeared in this repo). Mixes in business/marketing
    # analyst rows -- strict_sources in the user config gates those out.

  - name: vanshb03-2027
    adapter: vanshb03_md
    repo: vanshb03/Summer2027-Internships
    branch: dev
    files: ["README.md", "OFFSEASON_README.md"]
    default_terms:
      README.md: ["Summer 2027"]
      # OFFSEASON_README.md mixes Fall/Spring rows -- no safe default; term
      # inference / LLM handles those.

  - name: speedyapply
    adapter: speedyapply_md
    repo: speedyapply/2027-SWE-College-Jobs
    branch: main
    files: ["README.md"]
    # Renamed from 2026-SWE-College-Jobs (GitHub redirects); name kept for
    # state continuity. README.md is the USA internship list; NEW_GRAD_*.md
    # and INTERN_INTL.md are deliberately not subscribed.

  - name: speedyapply-ai
    adapter: speedyapply_md
    repo: speedyapply/2027-AI-College-Jobs
    branch: main
    files: ["README.md"]
    # AI/ML + data science USA internships, same table format as the SWE
    # list. On 2026-11-08 ~16% of its rows were in no other source.

  - name: zshah-2027
    adapter: zshah_json
    repo: zshah101/Automated-List-Of-Summer-2027-and-Fall-2026-Tech-Internships
    branch: main
    files: ["docs/api/jobs.json"]
    # MIT-licensed, auto-scraped from employer ATSes, open postings only.
    # The JSON is the full list (the README renders a truncated subset).
    # Strong on Workday / Oracle CX / SmartRecruiters, which the curated lists
    # and ats-boards miss: on 2026-11-08, 208 of its 1259 rows were in no
    # other source (125 Workday, 40 Oracle, 28 SmartRecruiters).
    #
    # Not subscribed: zapplyjobs/Internships-2027 -- its apply links are
    # zapply.jobs redirects, not employer URLs, so rows would not dedupe
    # against the other sources without resolving every link.

  - name: ats-boards
    adapter: ats_boards
    boards_file: data/ats_boards.yaml
    # Official public JSON APIs of Greenhouse/Lever/Ashby for every company
    # in the top/Atlanta lists that has a discoverable board. Catches
    # postings the moment they appear, independent of any curator.
    # Regenerate the board list with: python scripts/discover_ats_boards.py
