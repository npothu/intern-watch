<script type="text/javascript">
phApp.ddo = {"jobDetail": {"status": 200, "data": {"job": {"jobId": "2028084", "reqId": "2028084", "title": "Splunk Solutions Engineer (Intern) - United States", "companyName": "Cisco", "location": "Research Triangle Park, North Carolina, United States of America", "cityStateCountry": "Research Triangle Park, North Carolina, United States of America", "description": "<p>Please note this posting is to advertise potential job opportunities. This exact role may not be open today but could open in the near future. When you apply, a Cisco representative may contact you directly if a relevant position opens.</p><p></p><p></p><p><b><span style=\"font-size:inherit\">Job Description</span></b></p><p><span style=\"font-size:inherit\">Applications are accepted until further notice.\u202f\u202f\u00a0</span></p><br /><p><b>Meet the Team</b></p><p><span style=\"font-size:inherit\">Looking for an internship that blends your communication skills with your need to dabble in technology?\u00a0We\u2019re\u00a0looking for Technical Sales Interns who are interested in exploring a career as a Solutions Engineer, connecting people and business through technology.\u00a0</span></p><br /><p><b><span style=\"font-size:inherit\">What is a Sales Engineer exactly...</span></b><span style=\"font-size:inherit\">\u00a0</span></p><p><span style=\"font-size:inherit\">Corporations rely on technology to run their businesses. Splunk Products allow customers to investigate, monitor,\u00a0analyze\u00a0and act upon their data with one platform. The Solutions Engineer is\u00a0the\u00a0technical member of the Customer Account Team. They are the trusted advisor to both customers and the Sales Representative as the Splunk team collaborates to find the right solution for the business scenarios that are most important to the customer. Solutions Engineers tinker with the tech and translate it for a business ear. The\u00a0ultimate goal, of course, is the success of the customer.\u00a0</span></p><p>\u00a0</p><p><b><span style=\"font-size:inherit\">Your Impact</span></b></p><p><span style=\"font-size:inherit\">You know how to express yourself and you like to talk to people and learn what makes them tick. Cloud technology,\u00a0analytics\u00a0and data\u00a0fascinates\u00a0you!\u00a0You\u2019re\u00a0passionate about\u00a0learning, and\u00a0thrive when things get exciting\u2026 and you tinker. You tinker with anything, be it mechanical or software. Helping people is satisfying to you, and the bigger the puzzle to get there, the better.\u00a0</span></p><br /><p><span style=\"font-size:inherit\">Splunk Solutions Engineer Interns will get the opportunity to become familiar with the Splunk Product line through observatory sessions with professional Solutions Engineers:\u00a0</span></p><ul><li><span style=\"font-size:inherit\">Partner with a Professional Solutions Engineer as they work.\u00a0</span></li></ul><ul><li><span style=\"font-size:inherit\">Shadow customer calls and help out with presentation development, workshops and/or technical concept proof events as the account team moves the customers towards the close of sale.\u00a0</span></li></ul><ul><li><span style=\"font-size:inherit\">Meet weekly with other SE Interns and\u00a0mentors, and\u00a0discuss what\u00a0you\u2019ve\u00a0learned.\u00a0</span></li></ul><ul><li><span style=\"font-size:inherit\">Learn how to present technical concepts to customers and how to discover their needs.\u00a0</span></li></ul><ul><li><span style=\"font-size:inherit\">Collaborate with peers in developing a knowledge resource for\u00a0subsequent\u00a0intern cohorts.\u00a0</span></li></ul><ul><li><span style=\"font-size:inherit\">Polish your evangelizing technique, talking about our products and services to customers (without being pushy!)\u00a0</span></li></ul><br /><p><b><span style=\"font-size:inherit\">Minimum Qualifications </span></b></p><ul><li><span style=\"font-size:inherit\">Actively pursuing a Bachelor&#39;s or\u00a0Master&#39;s Degree in Computer Science, Software Engineering, Management Information Systems, Business Analytics, a related technical\u00a0field\u00a0or an established technical foundation. Applicants should also\u00a0possess\u00a0a strong record of academic achievement\u00a0</span></li></ul><ul><li>Expected to continue enrollment in a degree or qualifying educational or workforce development program following completion of the internship.\u202f\u202f\u00a0</li></ul><ul><li><span style=\"font-size:inherit\">Available to work\u00a040 hours\u00a0a week for\u00a012 weeks.</span></li></ul><p></p><h1>Why Cisco?\u00a0</h1><p>At Cisco, we\u2019re revolutionizing how data and infrastructure connect and protect organizations in the AI era \u2013 and beyond. We\u2019ve been innovating fearlessly for 40 years to create solutions that power how humans and technology work together across the physical and digital worlds. These solutions provide customers with unparalleled security, visibility, and insights across the entire digital footprint.</p><p>Fueled by the depth and breadth of our technology, we experiment and create meaningful solutions. Add to that our worldwide network of doers and experts, and you\u2019ll see that the opportunities to grow and build are limitless. We work as a team, collaborating with empathy to make really big things happen on a global scale. Because our solutions are everywhere, our impact is everywhere.\u00a0</p><p>We are Cisco, and our power starts with you.\u00a0</p><p></p><h1>Message to applicants applying to work in the U.S. and/or Canada:</h1><p></p><p>Individual pay is determined by the candidate&#39;s hiring location, market conditions, job-related skillset, experience, qualifications, education, certifications, and/or training. The full salary range for certain locations is listed below. For locations not listed below, the recruiter can share more details about compensation for the role in your location during the hiring process.</p><p></p><p>U.S. employees are offered benefits, subject to Cisco\u2019s plan eligibility rules, which include medical, dental and vision insurance, a 401(k) plan with a Cisco matching contribution, paid parental leave, short and long-term disability coverage, and basic life insurance. Please see the Cisco careers site to discover more benefits and perks.\u00a0 Employees may be eligible to receive grants of Cisco restricted stock units, which vest following continued employment with Cisco for defined periods of time.</p><p></p><p>U.S. employees are eligible for paid time away as described below, subject to Cisco\u2019s policies:</p><ul><li><p>10 paid holidays per full calendar year, plus 1 floating holiday for non-exempt employees</p></li><li><p>1 paid day off for employee\u2019s birthday, paid year-end holiday shutdown, and 4 paid days off for personal wellness determined by Cisco</p></li><li><p>Non-exempt employees** receive 16 days of paid vacation time per full calendar year, accrued at rate of 4.92 hours per pay period for full-time employees</p></li><li><p>Exempt employees participate in Cisco\u2019s flexible vacation time off program, which has no defined limit on how much vacation time eligible employees may use (subject to availability and some business limitations)</p></li><li><p>80 hours of sick time off provided on hire date and each January 1st thereafter, and up to 80 hours of\u00a0unused sick time\u00a0carried forward\u00a0from one calendar year\u00a0to the next</p></li><li><p>Additional paid time away may be requested to deal with critical or emergency issues for family members</p></li><li><p>Optional 10 paid days per full calendar year to volunteer</p></li></ul><p></p><p>For non-sales roles, employees are also eligible to earn annual bonuses subject to Cisco\u2019s policies.</p><p></p><p>Employees on sales plans earn performance-based incentive pay on top of their base salary, which is split between quota and non-quota components, subject to the applicable Cisco plan. For quota-based incentive pay, Cisco typically pays as follows:</p><ul><li><p>.75% of incentive target for each 1% of revenue attainment up to 50% of quota;</p></li><li><p>1.5% of incentive target for each 1% of attainment between 50% and 75%;</p></li><li><p>1% of incentive target for each 1% of attainment between 75% and 100%; and</p></li><li><p>Once performance exceeds 100% attainment, incentive rates are at or above 1% for each 1% of attainment with no cap on incentive compensation.</p></li></ul><p></p><p>For non-quota-based sales performance elements such as strategic sales objectives, Cisco may pay 0% up to 125% of target. Cisco sales plans do not have a minimum threshold of performance for sales incentive compensation to be paid.</p><p></p><p>The applicable full salary ranges for this position, by specific state, are listed below:</p><p></p><p>New York City Metro Area:</p>$44,000.00 - $185,000.00<p>Non-Metro New York state &amp; Washington state: </p>$44,000.00 - $185,000.00<p>* For quota-based sales roles on Cisco\u2019s sales plan, the ranges provided in this posting include base pay and sales target incentive compensation combined.</p><p>** Employees in Illinois, whether exempt or non-exempt, will participate in a unique time off program to meet local requirements.</p>"}}}, "siteConfig": {"locale": "en_US"}}; phApp.experimentData = {};
